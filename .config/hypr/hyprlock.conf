# Graphite, a juego con Waybar, las notificaciones y el launcher.
$font = Noto Sans

general {
    hide_cursor = true
}

# Huella por fprintd y contraseña disponibles en paralelo.
auth {
    pam {
        enabled = true
    }
    fingerprint {
        enabled = true
        ready_message = Apoyá el dedo para desbloquear
        present_message = Leyendo huella…
        retry_delay = 250
    }
}

# El mismo fondo del escritorio, suavizado para mantener el contraste.
# monitor vacío aplica el diseño a todas las pantallas.
background {
    monitor =
    path = /home/hhouse/Pictures/Wallpapers/yonatan-anugerah-3k0-K12TgLc-unsplash.jpg
    color = rgba(181818ff)
    blur_passes = 2
    blur_size = 4
    noise = 0.008
    contrast = 0.95
    brightness = 0.38
    vibrancy = 0.0
}

label {
    monitor =
    text = cmd[update:1000] date '+<span weight="light">%H:%M</span>'
    color = rgba(ecececff)
    font_size = 76
    font_family = $font
    shadow_passes = 2
    shadow_size = 3
    position = 0, 180
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date '+%d / %m / %Y'
    color = rgba(e7e7e7ff)
    font_size = 16
    font_family = $font
    shadow_passes = 2
    shadow_size = 3
    position = 0, 108
    halign = center
    valign = center
}

# Tarjeta central con los radios y colores de los paneles actuales.
shape {
    monitor =
    size = 380, 250
    color = rgba(212121ee)
    rounding = 18
    border_size = 1
    border_color = rgba(3b3b3bff)
    shadow_passes = 2
    shadow_size = 8
    shadow_color = rgba(00000044)
    position = 0, -75
    halign = center
    valign = center
    zindex = 0
}

label {
    monitor =
    text = 
    color = rgba(b5b5b5ff)
    font_size = 24
    font_family = FontAwesome
    position = 0, 0
    halign = center
    valign = center
    zindex = 1
}

label {
    monitor =
    text = <b>$USER</b>
    color = rgba(ecececff)
    font_size = 18
    font_family = $font
    position = 0, -46
    halign = center
    valign = center
    zindex = 1
}

input-field {
    monitor =
    size = 316, 54
    outline_thickness = 1
    outer_color = rgba(616161ff)
    inner_color = rgba(181818ff)
    font_color = rgba(ecececff)
    font_family = $font
    rounding = 10
    fade_on_empty = false
    dots_size = 0.22
    dots_spacing = 0.3
    placeholder_text = <span foreground="##a1a1a1">Contraseña</span>
    check_color = rgba(e7e7e7ff)
    check_text = Verificando…
    fail_color = rgba(e5aaaaff)
    fail_text = Intentá de nuevo
    capslock_color = rgba(d7bb90ff)
    position = 0, -105
    halign = center
    valign = center
    zindex = 1
}

label {
    monitor =
    text = Enter para desbloquear
    color = rgba(a1a1a1ff)
    font_size = 11
    font_family = $font
    position = 0, -162
    halign = center
    valign = center
    zindex = 1
}

# El aviso aparece cuando el lector está listo y sigue su estado real.
label {
    monitor =
    text = $FPRINTPROMPT
    color = rgba(e7e7e7ff)
    font_size = 12
    font_family = $font
    shadow_passes = 2
    shadow_size = 3
    position = 0, -232
    halign = center
    valign = center
    zindex = 1
}
