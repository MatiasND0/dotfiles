# Aplicaciones
$terminal = kitty
$fileManager = dolphin
$menu = /home/hhouse/.local/bin/aplicaciones

# Inicio automático
# Completar el desbloqueo de KWallet iniciado por SDDM/PAM.
exec-once = /usr/share/libpam-kwallet-common/pam_kwallet_init
exec-once = waybar
exec-once = /home/hhouse/.local/bin/swaync
exec-once = kitty --title Codex codex
exec-once = kitty --title Fastfetch sh -c 'fastfetch; exec bash'
exec-once = spotify
# Fondo en todas las pantallas, incluidas las que se reconectan al hub.
# También se inicia al recargar; el script evita instancias duplicadas.
exec = /home/hhouse/.local/bin/fondo-pantalla
exec-once = hypridle
# Indicadores de brillo, volumen y micrófono.
exec-once = /home/hhouse/.local/bin/swayosd-server

# Historial del portapapeles; también se inicia al recargar (sin duplicarse).
exec = /home/hhouse/.local/bin/portapapeles --start

# Proyección y ubicación de pantallas. El servicio se inicia sin duplicarse.
exec = /home/hhouse/.local/bin/pantallas --daemon
source = /home/hhouse/.config/hypr/monitors.conf

# Inicio automático
#exec-once = waybar

# Atajos
$mainMod = SUPER

bind = $mainMod, T, exec, $terminal
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, R, exec, $menu
bind = $mainMod, V, exec, /home/hhouse/.local/bin/portapapeles
# Proyectar: la primera pulsación abre el panel; las siguientes recorren modos.
bindp = $mainMod, P, exec, /home/hhouse/.local/bin/pantallas
bindp = , XF86Display, exec, /home/hhouse/.local/bin/pantallas
bindp = , XF86DisplayToggle, exec, /home/hhouse/.local/bin/pantallas
bind = $mainMod, L, exec, hyprlock
bind = $mainMod, Q, killactive,
bind = $mainMod+shift, P, exec, hyprctl dispatch exit
#bind = $mainMod, F, exec, microsoft-edge

# Maximizar conservando Waybar; con Shift, usar pantalla completa.
bind = $mainMod, F, fullscreen, 1
bind = $mainMod SHIFT, F, fullscreen, 0

# Intercambiar la tile activa con otra
bind = $mainMod SHIFT, left, swapwindow, l
bind = $mainMod SHIFT, right, swapwindow, r
bind = $mainMod SHIFT, up, swapwindow, u
bind = $mainMod SHIFT, down, swapwindow, d

bindm = SUPER, mouse:272, movewindow
bindm = SUPER, mouse:273, resizewindow

# Capturas al portapapeles
bind = , Print, exec, grim -g "$(slurp)" - | wl-copy
bind = $mainMod SHIFT, S, exec, grim -g "$(slurp)" - | wl-copy

# Volumen
bindel = , XF86AudioRaiseVolume, exec, /home/hhouse/.local/bin/swayosd-client --output-volume +5

bindel = , XF86AudioLowerVolume, exec, /home/hhouse/.local/bin/swayosd-client --output-volume -5
bindl = , XF86AudioMute, exec, /home/hhouse/.local/bin/swayosd-client --output-volume mute-toggle
bindl = , XF86AudioMicMute, exec, /home/hhouse/.local/bin/swayosd-client --input-volume mute-toggle

# Brillo
bindel = , XF86MonBrightnessUp, exec, /home/hhouse/.local/bin/swayosd-client --brightness +5
bindel = , XF86MonBrightnessDown, exec, /home/hhouse/.local/bin/swayosd-client --brightness -5

# Multimedia y teclas especiales
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous
bindl = , XF86AudioStop, exec, playerctl stop
bind = , XF86Calculator, exec, kcalc

# Cambiar de escritorio deslizando tres dedos a izquierda o derecha.
gesture = 3, horizontal, workspace

# Cambiar de escritorio (SUPER + 1..9, 0)
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Mover ventana activa a otro escritorio
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

general {
    gaps_in = 6
    gaps_out = 12
    border_size = 2
    col.active_border = rgba(777777ee)
    col.inactive_border = rgba(363636aa)
    resize_on_border = true
}

# Quitar los márgenes solo al maximizar, respetando el espacio de Waybar.
workspace = f[1], gapsout:0, gapsin:0

decoration {
    rounding = 10

    active_opacity = 0.95
    inactive_opacity = 0.85
    fullscreen_opacity = 0.97

    blur {
        enabled = true
        size = 3
        passes = 3
        new_optimizations = true
    }

    shadow {
        enabled = true
        range = 14
        render_power = 3
        color = rgba(00000055)
    }
}

# Fondo de respaldo durante la carga del escritorio.
misc {
    # Permitir que un clic en una notificación enfoque su ventana.
    focus_on_activate = true
    background_color = rgb(181818)
    disable_hyprland_logo = true
    disable_splash_rendering = true
}
