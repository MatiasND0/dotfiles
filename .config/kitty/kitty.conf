# Paleta oscura: verde, violeta y naranja.

# Tipografía
font_family Noto Sans Mono
bold_font auto
italic_font auto
bold_italic_font auto
font_size 11.0
disable_ligatures never

# Ventana
background                #1c1926
foreground                #e6def5
background_opacity 1.0
dynamic_background_opacity yes
window_padding_width 14
active_border_color       #bb9af7
inactive_border_color     #363046
bell_border_color         #ff9e64

# Cursor y selección
cursor                    #bb9af7
cursor_text_color         #1c1926
cursor_shape block
cursor_blink_interval 0.7
selection_foreground      #f4efff
selection_background      #45375b
url_color                 #bb9af7

# Pestañas
tab_bar_edge top
tab_bar_style separator
tab_separator "  ·  "
tab_bar_background        #1c1926
tab_bar_margin_width 8
tab_bar_margin_height 6 3
active_tab_font_style bold
active_tab_foreground     #1c1926
active_tab_background     #bb9af7
inactive_tab_foreground   #aaa1bb
inactive_tab_background   #262131

# Colores de salida: tonos suaves para conservar errores, avisos y sintaxis.
color0                    #262131
color1                    #f7768e
color2                    #9ece6a
color3                    #e0af68
color4                    #7aa2f7
color5                    #bb9af7
color6                    #7dcfff
color7                    #d5cde0
color8                    #686078
color9                    #ff9eac
color10                   #b5e890
color11                   #f2c979
color12                   #9abbff
color13                   #d4b7ff
color14                   #a4e4ff
color15                   #f4efff

# Comportamiento
# Dejar que Hyprland distribuya las tiles sin restaurar la ventana maximizada.
remember_window_size no
enable_audio_bell no
copy_on_select yes
scrollback_lines 10000
confirm_os_window_close 0
